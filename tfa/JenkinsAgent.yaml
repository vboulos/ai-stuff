apiVersion: v1
kind: Pod
metadata:
  labels:
    label: tfa
    owner: pics
spec:
  activeDeadlineSeconds: 18000
  containers:
  - name: jnlp
    image: "image-registry.openshift-image-registry.svc:5000/dno--jenkins-csb-rhacm/tests-jenkins-agent:latest"
    workingDir: '/home/jenkins'
    env:
      - name: HOME
        value: '/home/jenkins'
    resources:
      limits:
        cpu: 500m
        memory: 300Mi
      requests:
        cpu: 50m
        memory: 256Mi
  - name: tfa-container
    # ubi9 and python
    image: 'quay.io/vboulos/acmqe-automation/pics@sha256:07cc438463aba6aa6eb08c4bc98120895284501b46d8cc23f8d78f0d2b4164e9'
    # image: 'quay.io/vboulos/acmqe-automation/python@sha256:b8530f17e1b7ae02090ba702f04f6b20a0688e464ca18de6d81be69ae28c5137'
    registry: docker.io
    # imagePullSecrets: 'agent-image-secret'
    ttyEnabled: true
    alwaysPullImage: true
    command: [ 'sleep', '365d' ]
    workingDir: '/home/jenkins'
    env:
      - name: HOME
        value: '/home/jenkins'
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi